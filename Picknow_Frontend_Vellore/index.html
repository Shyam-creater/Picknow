<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://play-lh.googleusercontent.com/QGUisJxsTg4SPMgTEN7n3G9TYrQT54j2F0SI35xvC293neDyhp8WWeqOYKlR7aLBJ5PE"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picknow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/src/assets/dryfruits.jpg" fetchpriority="high">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PickNow",
        "url": "https://www.picknow.in",
        "logo": "https://www.picknow.in/assets/PicknowLogo-DKjBQdVT.png",
        "sameAs": [
          "https://www.facebook.com/picknow001/",
          "https://www.instagram.com/picknow.official/",
          "https://x.com/picknow00/"
        ],
        "description": "PickNow offers 100% organic dry fruits, herbal wellness products, and chemical-free groceries delivered across India.",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+91 7092770118",
          "contactType": "Customer Support",
          "areaServed": "IN",
          "availableLanguage": "en"
        }
      }
    </script>
  </head>
  <body>
    <style>
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
    <div id="root">
      <div style="width: 100%; height: 60vh; background-color: #f0f0f0; animation: pulse 1.5s infinite;"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
